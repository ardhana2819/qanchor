# Runs on every PR and on main (NFR-020). Cloudflare Pages does not wait for this workflow,
# so "merge only when CI is green" is a manual rule (NFR-021).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run size
      # Only runtime dependencies reach users; dev tooling advisories are reviewed by hand.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # A job usually takes 4 to 11 minutes, but WebKit reached 18 and then hit 20 when the
    # runner's `playwright install` was slow (PR #58, #59). 30 leaves room for that while still
    # stopping a hung run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
